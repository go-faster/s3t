name: e2e

# Runs the suite against a real S3 server.
#
# The server is go-faster/fs, built from source: a public runner has no Ceph,
# and a conformance suite that never runs against an implementation is only
# checking that it compiles. fs is in the same org, is a single static binary,
# and builds in seconds, so every pull request gets a real end-to-end run with
# no service container and no credentials.
#
# The gate is fs's own known-failures list, consumed unmodified: everything not
# in it must pass, and anything in it that passes is reported. That file is what
# fs already holds itself to under pytest, so a disagreement here is a
# regression in the port rather than an argument about what should pass.
#
# Most of its entries name tests this port does not have yet -- s3t is a subset
# of upstream -- so they are counted and printed rather than treated as errors.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  S3_PORT: '8077'

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout s3t
        uses: actions/checkout@v4

      - name: Checkout go-faster/fs
        uses: actions/checkout@v4
        with:
          repository: go-faster/fs
          path: fs

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build s3t
        run: go build -o s3t ./cmd/s3t

      - name: Build fs
        working-directory: fs
        run: go build -o ../fs-server ./cmd/fs

      - name: Start fs
        run: |
          mkdir -p .s3data
          ./fs-server s3 \
            --config fs/.github/s3tests/server.yaml \
            --addr ":${S3_PORT}" \
            --root ./.s3data > fs-server.log 2>&1 &
          echo "$!" > fs.pid
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null "http://localhost:${S3_PORT}/health"; then
              echo "server up"; exit 0
            fi
            sleep 1
          done
          echo "server did not become healthy"; cat fs-server.log; exit 1

      - name: Run the suite
        run: |
          ./s3t run \
            --config fs/.github/s3tests/s3tests.conf \
            --known-failures fs/.github/s3tests/known-failures.txt \
            --junit s3t-junit.xml \
            --json s3t-results.json

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s3t-reports
          path: |
            s3t-junit.xml
            s3t-results.json
            fs-server.log

      - name: Stop fs
        if: always()
        run: |
          if [ -f fs.pid ]; then kill "$(cat fs.pid)" || true; fi
